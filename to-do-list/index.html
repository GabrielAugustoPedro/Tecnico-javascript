<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To do list</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Minhas Tarefas de hoje</h1>
           <button id="toggle-btn" onclick="toggleTheme()">🌕</button>
        </header>

        <form id="todo-form">
            <input id="todo-input" type="text" placeholder="O que você precisa fazer hoje?">
            <button type="submit">Adicionar</button>
        </form>

        <ol id="todo-list">
        </ol>

    </div>
    <div id="botoes-container">
        <button id="limpar-completadas">Limpar tarefas concluídas</button>
        <button id="limpar-todas">Limpar todas as tarefas</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
